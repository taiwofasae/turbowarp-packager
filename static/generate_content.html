<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Loosen CSP so the packaged project's inline scripts can run after page replacement -->
    <meta http-equiv="Content-Security-Policy" content="default-src * 'self' 'unsafe-inline' 'unsafe-eval' data: blob:">
    <title>Loading project...</title>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        background: #111;
        color: #fff;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }

      #loading-screen {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        text-align: center;
        padding: 32px;
      }

      #status-text {
        font-size: 18px;
        opacity: 0.85;
      }

      .progress-bar-outer {
        width: 260px;
        height: 10px;
        border: 1px solid rgba(255, 255, 255, 0.5);
        border-radius: 5px;
        overflow: hidden;
      }

      .progress-bar-inner {
        height: 100%;
        width: 0%;
        background: #fff;
        border-radius: 5px;
        transition: width 0.1s ease;
      }

      #error-screen {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        text-align: center;
        padding: 32px;
        max-width: 600px;
      }

      #error-screen h1 {
        font-size: 24px;
        font-weight: normal;
        margin: 0;
        color: #ff6b6b;
      }

      #error-message {
        font-family: monospace;
        font-size: 14px;
        background: rgba(255, 255, 255, 0.08);
        padding: 12px 16px;
        border-radius: 6px;
        white-space: pre-wrap;
        word-break: break-word;
        max-width: 100%;
        text-align: left;
      }
    </style>
  </head>
  <body>

    <div id="loading-screen">
      <div id="status-text">Loading project...</div>
      <div class="progress-bar-outer">
        <div class="progress-bar-inner" id="progress-bar"></div>
      </div>
    </div>

    <div id="error-screen">
      <h1>Error</h1>
      <pre id="error-message"></pre>
    </div>

    <!--
      packager-api.js is built by webpack from src/packager/web/export-api.js.
      It sets up window.PackagerAPI = { Packager, loadProject }.
      In dev mode (npm start) it is served at js/packager-api.js.
      It is built as a single self-contained chunk (no splitChunks for this entry).
    -->
    <script src="js/packager-api.js"></script>

    <script>
      (function () {
        // ── Helpers ──────────────────────────────────────────────────────────

        var progressBar  = document.getElementById('progress-bar');
        var statusText   = document.getElementById('status-text');
        var loadingScreen = document.getElementById('loading-screen');
        var errorScreen  = document.getElementById('error-screen');
        var errorMessage = document.getElementById('error-message');

        function setProgress(fraction) {
          progressBar.style.width = Math.round(Math.min(1, Math.max(0, fraction)) * 100) + '%';
        }

        function setStatus(text) {
          statusText.textContent = text;
        }

        function showError(err) {
          console.error(err);
          loadingScreen.style.display = 'none';
          errorScreen.style.display   = 'flex';
          errorMessage.textContent    = String(err && err.stack ? err.stack : err);
        }

        // ── Read project_url from query string ───────────────────────────────

        var params     = new URLSearchParams(location.search);
        var projectUrl = params.get('project_url');

        if (!projectUrl) {
          showError(
            'No project_url parameter found in the URL.\n\n' +
            'Expected format:\n' +
            '  generate_content.html?project_url=https://example.com/project.sb3'
          );
          return; // stop here — nothing more to do in this step
        }

        // Validate it looks like an http/https URL
        try {
          var parsed = new URL(projectUrl);
          if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') {
            throw new Error('URL must use http: or https: protocol');
          }
        } catch (e) {
          showError('Invalid project_url: ' + projectUrl + '\n\n' + e);
          return;
        }

        // ── Confirm PackagerAPI is available ─────────────────────────────────
        // (packager-api.js must have loaded before this inline script runs)

        if (typeof window.PackagerAPI === 'undefined') {
          showError(
            'PackagerAPI is not defined.\n\n' +
            'Make sure js/packager-api.js was built and is being served correctly.\n' +
            'Run `npm start` and check the browser console for build errors.'
          );
          return;
        }

        // ── All checks passed — kick off the async pipeline ─────────────────

        console.log('[generate_content] project_url:', projectUrl);
        console.log('[generate_content] PackagerAPI available:', Object.keys(window.PackagerAPI));

        var loadProject = window.PackagerAPI.loadProject;

        // Progress comes in as (type, a, b):
        //   type='fetch'   → a is 0-1 fraction of the raw .sb3 download
        //   type='assets'  → a=loaded count, b=total count
        //   type='compress'→ a is 0-1 fraction of zip compression
        function progressCallback(type, a, b) {
          if (type === 'fetch') {
            // Fetching the .sb3 file: map to 0–40% of the bar
            setProgress(a * 0.4);
            setStatus('Downloading project... ' + Math.round(a * 100) + '%');
          } else if (type === 'assets') {
            // Extracting and loading assets: map to 40–95%
            var fraction = b > 0 ? (a / b) : 0;
            setProgress(0.4 + fraction * 0.55);
            setStatus('Loading assets... ' + a + ' / ' + b);
          } else if (type === 'compress') {
            // Compressing: map to 95–99%
            setProgress(0.95 + a * 0.04);
            setStatus('Compressing...');
          }
        }

        setStatus('Downloading project...');
        setProgress(0.02);

        loadProject.fromURL(projectUrl, progressCallback)
          .then(function (result) {
            // result = { promise, terminate }
            // result.promise resolves to the project object once assets are loaded
            return result.promise;
          })
          .then(function (project) {
            // project = { arrayBuffer, type, analysis }
            console.log('[generate_content] project loaded:', project.type, project.analysis);
            setProgress(0.98);
            setStatus('Packaging...');

            // ── Step 5: run the packager and replace the page ─────────────

            var Packager = window.PackagerAPI.Packager;
            var packager = new Packager();

            // Use all defaults — target html, autoplay on, 480x360 stage.
            packager.project = project;
            packager.options.target = 'html';
            packager.options.autoplay = true;

            // Forward packager large-asset fetch progress into 98-100% of bar
            packager.addEventListener('large-asset-fetch', function (e) {
              setProgress(0.98 + e.detail.progress * 0.02);
              setStatus('Loading runtime...');
            });

            return packager.package();
          })
          .then(function (result) {
            // result.data is a Uint8Array of the complete self-contained HTML.
            // Decode it and replace the entire page in-place.
            setProgress(1);
            setStatus('Done.');

            var html = new TextDecoder().decode(result.data);

            // document.open/write/close replaces the page at the same origin
            // without a navigation — the URL stays as generate_content.html?...
            document.open();
            document.write(html);
            document.close();
          })
          .catch(function (err) {
            showError(err);
          });

      })();
    </script>

  </body>
</html>
