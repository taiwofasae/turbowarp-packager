<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Loosen CSP so the packaged project's inline scripts can run after page replacement -->
    <meta http-equiv="Content-Security-Policy" content="default-src * 'self' 'unsafe-inline' 'unsafe-eval' data: blob:">
    <title>Loading project...</title>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        background: #111;
        color: #fff;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }

      #loading-screen {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        text-align: center;
        padding: 32px;
      }

      #status-text {
        font-size: 18px;
        opacity: 0.85;
      }

      .progress-bar-outer {
        width: 260px;
        height: 10px;
        border: 1px solid rgba(255, 255, 255, 0.5);
        border-radius: 5px;
        overflow: hidden;
      }

      .progress-bar-inner {
        height: 100%;
        width: 0%;
        background: #fff;
        border-radius: 5px;
        transition: width 0.1s ease;
      }

      #error-screen {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        text-align: center;
        padding: 32px;
        max-width: 600px;
      }

      #error-screen h1 {
        font-size: 24px;
        font-weight: normal;
        margin: 0;
        color: #ff6b6b;
      }

      #error-message {
        font-family: monospace;
        font-size: 14px;
        background: rgba(255, 255, 255, 0.08);
        padding: 12px 16px;
        border-radius: 6px;
        white-space: pre-wrap;
        word-break: break-word;
        max-width: 100%;
        text-align: left;
      }
    </style>
  </head>
  <body>

    <div id="loading-screen">
      <div id="status-text">Loading project...</div>
      <div class="progress-bar-outer">
        <div class="progress-bar-inner" id="progress-bar"></div>
      </div>
    </div>

    <div id="error-screen">
      <h1>Error</h1>
      <pre id="error-message"></pre>
    </div>

    <!--
      packager-api.js is built by webpack from src/packager/web/export-api.js.
      It sets up window.PackagerAPI = { Packager, loadProject }.
      In dev mode (npm start) it is served at js/packager-api.js.
      It is built as a single self-contained chunk (no splitChunks for this entry).
    -->
    <script src="js/packager-api.js"></script>

    <script>
      (function () {
        // ── Helpers ──────────────────────────────────────────────────────────

        var progressBar   = document.getElementById('progress-bar');
        var statusText    = document.getElementById('status-text');
        var loadingScreen = document.getElementById('loading-screen');
        var errorScreen   = document.getElementById('error-screen');
        var errorMessage  = document.getElementById('error-message');

        function setProgress(fraction) {
          progressBar.style.width = Math.round(Math.min(1, Math.max(0, fraction)) * 100) + '%';
        }

        function setStatus(text) {
          statusText.textContent = text;
        }

        function showError(err) {
          console.error(err);
          loadingScreen.style.display = 'none';
          errorScreen.style.display   = 'flex';
          errorMessage.textContent    = String(err && err.stack ? err.stack : err);
        }

        // ── Read project_url from query string ───────────────────────────────

        var params     = new URLSearchParams(location.search);
        var projectUrl = params.get('project_url');

        if (!projectUrl) {
          showError(
            'No project_url parameter found in the URL.\n\n' +
            'Expected format:\n' +
            '  generate_content.html?project_url=https://example.com/project.sb3'
          );
          return;
        }

        try {
          var parsed = new URL(projectUrl);
          if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') {
            throw new Error('URL must use http: or https: protocol');
          }
        } catch (e) {
          showError('Invalid project_url: ' + projectUrl + '\n\n' + e);
          return;
        }

        // Confirm PackagerAPI is available 

        if (typeof window.PackagerAPI === 'undefined') {
          showError(
            'PackagerAPI is not defined.\n\n' +
            'Make sure js/packager-api.js was built and is being served correctly.\n' +
            'Run `npm start` and check the browser console for build errors.'
          );
          return;
        }

        // ── Kick off the full pipeline ────────────────────────────────────────

        console.log('[generate_content] project_url:', projectUrl);
        console.log('[generate_content] PackagerAPI available:', Object.keys(window.PackagerAPI));

        var loadProject = window.PackagerAPI.loadProject;

        function progressCallback(type, a, b) {
          if (type === 'fetch') {
            setProgress(a * 0.4);
            setStatus('Downloading project... ' + Math.round(a * 100) + '%');
          } else if (type === 'assets') {
            var fraction = b > 0 ? (a / b) : 0;
            setProgress(0.4 + fraction * 0.55);
            setStatus('Loading assets... ' + a + ' / ' + b);
          } else if (type === 'compress') {
            setProgress(0.95 + a * 0.04);
            setStatus('Compressing...');
          }
        }

        setStatus('Downloading project...');
        setProgress(0.02);

        // Step 4: load the project from URL
        loadProject.fromURL(projectUrl, progressCallback)
          .then(function (result) {
            return result.promise;
          })

          // Step 5: package it and replace the page
          .then(function (project) {
            console.log('[generate_content] project loaded:', project.type, project.analysis);
            setProgress(0.98);
            setStatus('Packaging... (this may take a moment)');

            var Packager = window.PackagerAPI.Packager;
            var packager = new Packager();

            packager.project = project;
            packager.options.target = 'html';
            packager.options.autoplay = false;
            packager.options.controls.greenFlag.enabled = true;

            packager.addEventListener('large-asset-fetch', function (e) {
              setProgress(0.98 + e.detail.progress * 0.02);
              setStatus('Loading runtime... ' + Math.round(e.detail.progress * 100) + '%');
            });

            // Run packager and render — no Promise wrapper needed
            packager.package()
              .then(function (result) {
                console.log('[generate_content] rendering HTML, length:', result.data.length);
                setProgress(1);
                setStatus('Done.');

                // Create a blob URL from the packaged HTML and navigate to it.
                // This is more reliable than document.write() across all browsers.
                var blob = new Blob([result.data], {type: 'text/html'});
                var url = URL.createObjectURL(blob);
                location.replace(url);
              })
              .catch(function (err) {
                showError(err);
              });
          })

          .catch(function (err) {
            showError(err);
          });

      })();
    </script>

  </body>
</html>
